services:
  - type: web
    name: sairam-campus-transport-portal
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: cd server && npx prisma db push && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://sairam-campus-transport-portal.onrender.com
